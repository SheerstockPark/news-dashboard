name: AI sentiment enrichment → Turso

# Every 3h: score the newly-ingested oil-relevant headlines with Claude (Haiku) so the
# dashboard's impact tags, tone bar, "biggest issues" ranking and the email all run on
# AI sentiment instead of the keyword tagger. Only scores rows not yet scored, so nothing
# is missed at the lower cadence — it just batches more per run, at a third of the API
# calls (cost control after the June credit burn). Needs ANTHROPIC_API_KEY.
on:
  # Schedule disabled 2026-07-04: the Anthropic API credit is exhausted, so every run fails
  # (red noise that drowns out real watchdog alarms). The built-in keyword tagger keeps
  # relevance/impact working without it. Re-enable when API credit is topped up — the free
  # architecture runs briefings on the Claude subscription instead.
  # schedule:
  #   - cron: "20 */3 * * *"   # every 3h, offset from the ingest/alert crons
  workflow_dispatch: {}

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-brief.txt
      - name: Score new oil-relevant headlines
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/enrich_sentiment.py --min-relevance 25 --limit 200
