name: Urgent headline alerts → Neil

# Manual one-shot urgent sweep. The */15 schedule is RETIRED (2026-07-13): it coordinated
# with the urgent loop through Turso dedupe, and Turso's free-tier read quota is exhausted
# (reads blocked). The loop (urgent-loop.yml) is now self-contained with file+cache state;
# this workflow remains as a manually-triggered single sweep sharing that same state and
# concurrency group, so it can never race the loop or double-send.
on:
  # schedule:                    # retired — see note above
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: urgent-loop
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-brief.txt
      - name: Restore urgent dedupe state
        uses: actions/cache/restore@v4
        with:
          path: data/db/urgent_state.json
          key: urgent-state-${{ github.run_id }}
          restore-keys: |
            urgent-state-
      - name: Email very-big headlines (single sweep)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python tools/run_alerts.py --urgent --fetch
      - name: Save urgent dedupe state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/db/urgent_state.json
          key: urgent-state-${{ github.run_id }}
