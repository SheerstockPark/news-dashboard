name: Urgent alerts — near-instant loop

# Free replacement for a paid always-on worker: this repo is public, so GitHub-hosted runners
# are free — each run polls the feeds every 60s for ~58 minutes, then exits cleanly and the
# next scheduled run takes over. Result: ~1-minute urgent-alert latency at £0.
#
# ⚠️ Deliberately NO Turso credentials (2026-07-13): the loop's every-60s DB polling burned
# through the Turso free-tier read quota and got the whole database read-blocked. The loop is
# now self-contained: feeds → runner-local SQLite → qualify → email. Dedupe + cooldown state
# lives in data/urgent_state.json, carried between ephemeral runners by actions/cache.
#
# Resilience layers:
#   * three staggered crons — GitHub silently drops/delays schedules (observed: one hourly
#     cron fired ~4x/day); extras queue-cancel harmlessly under the concurrency group.
#   * concurrency group runs one loop at a time — no state races, seamless handover.
#   * a fresh runner with no cached state baselines silently (no backlog blast).
#   * one bad tick inside the loop logs and continues (see run_alerts.py).
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: urgent-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-brief.txt
      - name: Restore urgent dedupe state
        uses: actions/cache/restore@v4
        with:
          path: data/db/urgent_state.json
          key: urgent-state-${{ github.run_id }}
          restore-keys: |
            urgent-state-
      - name: Poll urgent headlines (60s interval, ~58 min, then hand over)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set +e
          timeout 3480 python tools/run_alerts.py --urgent --fetch --loop --interval 60
          code=$?
          # timeout(1) exits 124 when the window ends — that's the planned handover, not a failure
          if [ "$code" -eq 124 ]; then
            echo "Window complete — handing over to the next scheduled run."
            exit 0
          fi
          exit $code
      - name: Save urgent dedupe state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/db/urgent_state.json
          key: urgent-state-${{ github.run_id }}
